<svg width="850" height="480" viewBox="0 0 850 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #64748B; font-weight: 500; }
    .label { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
    .text-dark { fill: #1E293B; }
    .arrow-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #64748B; font-weight: 600; text-anchor: middle; }
    .card { filter: url(#shadow); rx: 8px; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF" />
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#757575" />
    </marker>
  </defs>

  <!-- Logo/Header -->
  <text x="25" y="40" class="title">RADIENT AI</text>
  <text x="145" y="40" class="title" style="fill: #94A3B8; font-weight: 300;">|</text>

    <text x="160" y="40" class="subtitle">Secure Cloud Run Layout &amp; Domain Mapping</text>
    
    <!-- Custom Domain DNS -->
    <rect x="40" y="210" width="130" height="60" fill="#4285F4" class="card" />
    <text x="105" y="240" class="label">Custom Domain</text>
    <text x="105" y="260" class="subtitle" style="fill:#FFFFFF; font-size:10px;">rad-ai.solutions</text>
    
    <!-- Frontend -->
    <rect x="230" y="130" width="160" height="80" fill="#4285F4" class="card" />
    <text x="310" y="160" class="label">Frontend Service</text>
    <text x="310" y="190" class="subtitle" style="fill:#FFFFFF; font-size:10px;">Cloud Run (React/Vite)</text>
    
    <!-- Backend -->
    <rect x="460" y="130" width="160" height="80" fill="#34A853" class="card" />
    <text x="540" y="160" class="label">Backend Service</text>
    <text x="540" y="190" class="subtitle" style="fill:#FFFFFF; font-size:10px;">Cloud Run (Express)</text>
    
    <!-- Scenario Agent -->
    <rect x="460" y="290" width="160" height="80" fill="#FBBC05" class="card" />
    <text x="540" y="320" class="label">Scenario Agent</text>
    <text x="540" y="350" class="subtitle" style="fill:#FFFFFF; font-size:10px;">Cloud Run (A2A)</text>
    
    <!-- Firestore -->
    <rect x="690" y="130" width="120" height="80" fill="#34A853" class="card" />
    <text x="750" y="170" class="label">Cloud Firestore</text>
    
    <!-- Gemini -->
    <rect x="690" y="290" width="120" height="80" fill="#8E24AA" class="card" />
    <text x="750" y="330" class="label">Gemini API</text>

    <!-- Connectors -->
    <path d="M 170 230 L 200 230 L 200 170 L 220 170" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 200 230 L 450 230" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    
    <path d="M 390 170 L 450 170" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 620 170 L 680 170" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    
    <path d="M 540 210 L 540 280" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 620 330 L 680 330" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    </svg>