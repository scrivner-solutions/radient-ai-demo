<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #64748B; font-weight: 500; }
    .label { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
    .text-dark { fill: #1E293B; }
    .arrow-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #64748B; font-weight: 600; text-anchor: middle; }
    .card { filter: url(#shadow); rx: 8px; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF" />
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#757575" />
    </marker>
  </defs>

  <!-- Logo/Header -->
  <text x="25" y="40" class="title">RADIENT AI</text>
  <text x="145" y="40" class="title" style="fill: #94A3B8; font-weight: 300;">|</text>

    <text x="160" y="40" class="subtitle">Separation of Concerns in Radient AI</text>
    
    <!-- Deterministic calculations side -->
    <rect x="50" y="120" width="320" height="260" fill="none" stroke="#34A853" stroke-width="2" rx="12" />
    <rect x="70" y="140" width="280" height="40" fill="#34A853" rx="6" />
    <text x="210" y="160" class="label">Deterministic Tools</text>
    
    <text x="80" y="220" class="subtitle text-dark" style="font-weight:700;">OWNS ALL NUMERICS</text>
    <text x="80" y="250" class="subtitle text-dark">• Worked / Paid FTE calculations</text>
    <text x="80" y="280" class="subtitle text-dark">• Overtime rates &amp; financial math</text>
    <text x="80" y="310" class="subtitle text-dark">• Scanner utilization metrics</text>
    <text x="80" y="340" class="subtitle text-dark">• Rigorous operational validation</text>
    
    <!-- Generative synthesis side -->
    <rect x="430" y="120" width="320" height="260" fill="none" stroke="#8E24AA" stroke-width="2" rx="12" />
    <rect x="450" y="140" width="280" height="40" fill="#8E24AA" rx="6" />
    <text x="590" y="160" class="label">Generative AI (Gemini)</text>
    
    <text x="460" y="220" class="subtitle text-dark" style="font-weight:700;">OWNS EXPLANATIONS</text>
    <text x="460" y="250" class="subtitle text-dark">• Executive tradeoff synthesis</text>
    <text x="460" y="280" class="subtitle text-dark">• Natural language reporting</text>
    <text x="460" y="310" class="subtitle text-dark">• Grounded guideline recommendations</text>
    <text x="460" y="340" class="subtitle text-dark">• CFO-ready narrative explanations</text>
    
    <!-- Connectors -->
    <path d="M 370 250 L 430 250" stroke="#757575" stroke-dasharray="4 4" stroke-width="2" marker-end="url(#arrow)" />
    <text x="400" y="240" class="arrow-text">Feeds data</text>
    </svg>