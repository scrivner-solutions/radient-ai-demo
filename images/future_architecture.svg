<svg width="850" height="480" viewBox="0 0 850 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #64748B; font-weight: 500; }
    .label { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
    .text-dark { fill: #1E293B; }
    .arrow-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #64748B; font-weight: 600; text-anchor: middle; }
    .card { filter: url(#shadow); rx: 8px; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF" />
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#757575" />
    </marker>
  </defs>

  <!-- Logo/Header -->
  <text x="25" y="40" class="title">RADIENT AI</text>
  <text x="145" y="40" class="title" style="fill: #94A3B8; font-weight: 300;">|</text>

    <text x="160" y="40" class="subtitle">Transition to Vertex AI Agent Engine</text>
    
    <!-- Group CURRENT -->
    <rect x="40" y="110" width="360" height="280" fill="none" stroke="#CBD5E1" stroke-width="2" rx="10" />
    <text x="60" y="140" class="title" style="font-size:16px;">Current Architecture</text>
    
    <rect x="60" y="170" width="140" height="60" fill="#34A853" class="card" />
    <text x="130" y="200" class="label">Backend serving</text>
    
    <rect x="240" y="170" width="140" height="60" fill="#FBBC05" class="card" />
    <text x="310" y="200" class="label">A2A Scenario Agent</text>
    <path d="M 200 200 L 230 200" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    
    <rect x="240" y="290" width="140" height="60" fill="#8E24AA" class="card" />
    <text x="310" y="320" class="label">Gemini API</text>
    <path d="M 310 230 L 310 280" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Direction Arrow -->
    <path d="M 420 240 L 460 240" stroke="#757575" stroke-width="3" marker-end="url(#arrow)" />
    
    <!-- Group FUTURE -->
    <rect x="480" y="110" width="350" height="280" fill="none" stroke="#4285F4" stroke-width="2" rx="10" />
    <text x="500" y="140" class="title" style="font-size:16px; fill:#4285F4;">Future Architecture</text>
    
    <rect x="500" y="170" width="140" height="60" fill="#34A853" class="card" />
    <text x="570" y="200" class="label">Backend serving</text>
    
    <rect x="670" y="170" width="140" height="80" fill="#FBBC05" class="card" />
    <text x="740" y="200" class="label">Vertex AI</text>
    <text x="740" y="225" class="subtitle" style="fill:#FFFFFF; font-size:10px;">Agent Engine</text>
    <path d="M 640 200 L 660 200" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    
    <rect x="670" y="290" width="140" height="60" fill="#FBBC05" class="card" />
    <text x="740" y="320" class="label">Specialized Agents</text>
    <path d="M 740 250 L 740 280" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    </svg>