<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #64748B; font-weight: 500; }
    .label { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
    .text-dark { fill: #1E293B; }
    .arrow-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #64748B; font-weight: 600; text-anchor: middle; }
    .card { filter: url(#shadow); rx: 8px; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF" />
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#757575" />
    </marker>
  </defs>

  <!-- Logo/Header -->
  <text x="25" y="40" class="title">RADIENT AI</text>
  <text x="145" y="40" class="title" style="fill: #94A3B8; font-weight: 300;">|</text>

    <text x="160" y="40" class="subtitle">Agent Responsibilities and Pipeline Flow</text>
    
    <!-- Data Quality -->
    <rect x="50" y="120" width="280" height="100" fill="#FBBC05" class="card" />
    <text x="190" y="150" class="label">Data Quality Agent</text>
    <text x="190" y="180" class="subtitle" style="fill:#FFFFFF; font-size:11px;">Validates Modalities &amp; Cleans Inputs</text>
    
    <!-- Operational Benchmarking -->
    <rect x="470" y="120" width="280" height="100" fill="#FBBC05" class="card" />
    <text x="610" y="150" class="label">Benchmarking Agent</text>
    <text x="610" y="180" class="subtitle" style="fill:#FFFFFF; font-size:11px;">Compares with Synthetic Thresholds</text>
    
    <!-- Scenario Explorer -->
    <rect x="50" y="290" width="280" height="100" fill="#FBBC05" class="card" />
    <text x="190" y="320" class="label">Scenario Explorer Agent</text>
    <text x="190" y="350" class="subtitle" style="fill:#FFFFFF; font-size:11px;">Runs Simulations &amp; Proposes Changes</text>
    
    <!-- Executive Recommendation -->
    <rect x="470" y="290" width="280" height="100" fill="#FBBC05" class="card" />
    <text x="610" y="320" class="label">Executive Rec Agent</text>
    <text x="610" y="350" class="subtitle" style="fill:#FFFFFF; font-size:11px;">Synthesizes Rationale &amp; Tradeoffs</text>

    <!-- Connectors -->
    <!-- DQ to OB -->
    <path d="M 330 170 L 460 170" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    
    <!-- OB to SE -->
    <path d="M 610 220 L 610 250 L 190 250 L 190 280" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    
    <!-- SE to ER -->
    <path d="M 330 340 L 460 340" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    </svg>