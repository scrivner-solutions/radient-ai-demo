<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #64748B; font-weight: 500; }
    .label { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
    .text-dark { fill: #1E293B; }
    .arrow-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #64748B; font-weight: 600; text-anchor: middle; }
    .card { filter: url(#shadow); rx: 8px; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF" />
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#757575" />
    </marker>
  </defs>

  <!-- Logo/Header -->
  <text x="25" y="40" class="title">RADIENT AI</text>
  <text x="145" y="40" class="title" style="fill: #94A3B8; font-weight: 300;">|</text>

    <text x="160" y="40" class="subtitle">High-Level Operations &amp; A2A Overview</text>
    
    <!-- Nodes -->
    <!-- Users -->
    <rect x="50" y="180" width="120" height="60" fill="#4285F4" class="card" />
    <text x="110" y="210" class="label">Users</text>
    
    <!-- Frontend -->
    <rect x="230" y="180" width="150" height="60" fill="#4285F4" class="card" />
    <text x="305" y="210" class="label">Frontend UI</text>
    
    <!-- Backend -->
    <rect x="440" y="180" width="150" height="60" fill="#34A853" class="card" />
    <text x="515" y="210" class="label">Backend Serving</text>
    
    <!-- Remote Agent -->
    <rect x="440" y="320" width="150" height="60" fill="#FBBC05" class="card" />
    <text x="515" y="350" class="label">Scenario Agent</text>
    
    <!-- Gemini -->
    <rect x="650" y="320" width="120" height="60" fill="#8E24AA" class="card" />
    <text x="710" y="350" class="label">Gemini API</text>
    
    <!-- Boundaries -->
    <rect x="420" y="300" width="370" height="130" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 4" rx="12" />
    <text x="430" y="420" class="subtitle" style="font-size: 11px;">Scenario Agent Cloud Run Boundary</text>

    <!-- Connectors -->
    <!-- Users to FE -->
    <path d="M 170 210 L 220 210" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    <text x="195" y="200" class="arrow-text">HTTPS</text>
    
    <!-- FE to BE -->
    <path d="M 380 210 L 430 210" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    <text x="405" y="200" class="arrow-text">REST</text>
    
    <!-- BE to Agent -->
    <path d="M 515 240 L 515 310" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    <text x="565" y="280" class="arrow-text">JSON-RPC A2A</text>
    
    <!-- Agent to Gemini -->
    <path d="M 590 350 L 640 350" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    <text x="615" y="340" class="arrow-text">Prompt</text>
    
    <!-- Gemini back to Agent -->
    <path d="M 640 370 L 590 370" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    <text x="615" y="390" class="arrow-text">Response</text>
    </svg>