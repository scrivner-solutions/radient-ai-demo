<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 13px; fill: #64748B; font-weight: 500; }
    .label { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
    .text-dark { fill: #1E293B; }
    .arrow-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #64748B; font-weight: 600; text-anchor: middle; }
    .card { filter: url(#shadow); rx: 8px; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF" />
  
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#757575" />
    </marker>
  </defs>

  <!-- Logo/Header -->
  <text x="25" y="40" class="title">RADIENT AI</text>
  <text x="145" y="40" class="title" style="fill: #94A3B8; font-weight: 300;">|</text>

    <text x="160" y="40" class="subtitle">Scenario Exploration Flow &amp; Grounding Boundary</text>
    
    <!-- Nodes -->
    <!-- Goal -->
    <rect x="50" y="200" width="130" height="60" fill="#4285F4" class="card" />
    <text x="115" y="230" class="label">User Goal</text>
    
    <!-- Scenario Explorer -->
    <rect x="240" y="200" width="160" height="60" fill="#FBBC05" class="card" />
    <text x="320" y="230" class="label">Scenario Explorer</text>
    
    <!-- Deterministic Engine -->
    <rect x="460" y="140" width="170" height="60" fill="#34A853" class="card" />
    <text x="545" y="170" class="label">Deterministic Engine</text>
    
    <!-- Knowledge Service -->
    <rect x="460" y="260" width="170" height="60" fill="#94A3B8" class="card" />
    <text x="545" y="290" class="label">Grounding Playbooks</text>
    
    <!-- Gemini -->
    <rect x="670" y="200" width="110" height="60" fill="#8E24AA" class="card" />
    <text x="725" y="230" class="label">Gemini API</text>

    <!-- Connectors -->
    <path d="M 180 230 L 230 230" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    
    <path d="M 400 215 L 450 170" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 400 245 L 450 280" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    
    <path d="M 630 170 L 680 215" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 630 290 L 680 245" stroke="#757575" stroke-width="2" marker-end="url(#arrow)" />
    
    <!-- Explanation Output -->
    <path d="M 725 260 L 725 360 L 320 360 L 320 270" stroke="#8E24AA" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
    <text x="522" y="350" class="arrow-text" style="fill: #8E24AA;">Generates Explainable Recommendations</text>
    </svg>